name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: simple-agent-wallet
      - uses: actions/checkout@v4
        with:
          repository: x402-foundation/x402
          path: x402
          sparse-checkout: |
            go
          sparse-checkout-cone-mode: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: simple-agent-wallet/go.sum
      - name: Module replace
        working-directory: simple-agent-wallet
        run: |
          go mod edit -replace=github.com/x402-foundation/x402/go/v2=../x402/go
          go mod tidy
      - name: Test
        working-directory: simple-agent-wallet
        run: go test ./... -count=1
      - name: Race
        working-directory: simple-agent-wallet
        run: go test ./... -count=1 -race

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: simple-agent-wallet
      - uses: actions/checkout@v4
        with:
          repository: x402-foundation/x402
          path: x402
          sparse-checkout: |
            go
          sparse-checkout-cone-mode: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - working-directory: simple-agent-wallet
        run: |
          go mod edit -replace=github.com/x402-foundation/x402/go/v2=../x402/go
          go mod tidy
      - uses: goreleaser/goreleaser-action@v6
        with:
          workdir: simple-agent-wallet
          version: "~2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
